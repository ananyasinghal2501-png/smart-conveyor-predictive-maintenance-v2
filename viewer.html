<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Conveyor Digital Twin</title>
<link rel="icon" href="data:,">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14171a;
}

canvas {
    display: block;
}

#status {
    position: absolute;
    top: 14px;
    left: 14px;
    z-index: 10;

    padding: 7px 11px;
    border-radius: 7px;

    font-family: monospace;
    font-size: 11px;

    background: rgba(0, 0, 0, 0.55);
    color: #4b7bff;

    pointer-events: none;
}
</style>


<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>


<body>

<div id="status">
DIGITAL TWIN CONNECTING...
</div>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";


/* =========================================================
   CONFIG
========================================================= */

const API_URL =
    "http://127.0.0.1:8000/health";

const WS_URL =
    "ws://127.0.0.1:8000/ws";

const MODEL_URL =
    "./assets/conveyor.glb";

const STATE_COLORS = {
    Warning: new THREE.Color(0xffff00),  // Yellow
    Critical: new THREE.Color(0xff0000)  // Red
};


/* =========================================================
   SCENE
========================================================= */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x14171a
    );


/* =========================================================
   CAMERA
========================================================= */

const camera =
    new THREE.PerspectiveCamera(
        42,
        window.innerWidth /
        window.innerHeight,
        0.001,
        100
    );


/* =========================================================
   RENDERER
========================================================= */

const renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTS
========================================================= */

scene.add(
    new THREE.HemisphereLight(
        0xffffff,
        0x303840,
        2.6
    )
);


const mainLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

mainLight.position.set(
    4,
    7,
    5
);

scene.add(
    mainLight
);


const fillLight =
    new THREE.DirectionalLight(
        0xffffff,
        1.5
    );

fillLight.position.set(
    -5,
    3,
    -3
);

scene.add(
    fillLight
);


/* =========================================================
   CONTROLS
========================================================= */

const controls =
    new OrbitControls(
        camera,
        renderer.domElement
    );

controls.enableDamping = true;

controls.dampingFactor = 0.06;

controls.enableZoom = true;

controls.enablePan = true;


/* =========================================================
   REFERENCES
========================================================= */

let conveyor = null;

/*
   main.py (evaluate_faults) sends neutral part keys in "fault_parts".
   Left side  = key sent by FastAPI
   Right side = node names inside the NEW conveyor.glb
*/
const PART_MAP = {

    belt:             ["belt_top", "belt_return"],

    drive_pulley:     ["roller_0", "motor_body", "motor_shaft"],

    tail_pulley:      ["roller_1"],

    thermal_sensor:   ["temperature_sensor"],

    vibration_sensor: ["vibration_sensor"],

    flame_sensor:     ["flame_sensor"],

    load_cell:        ["load_cell", "load_sensor"]
};

const LEVEL_RANK = { Normal: 0, Warning: 1, Critical: 2 };

// key -> [THREE.Object3D, ...]   (filled after the GLB loads)
const partObjects = {};

let mixer = null;

let hasGLTFAnimation = false;


let conveyorRunning = false;

let conveyorSpeed = 0;


/* =========================================================
   FIND OBJECT
========================================================= */

function findObject(name) {
    if (!conveyor) return null;

    let exactMatch = null;
    let prefixMatch = null;

    conveyor.traverse(object => {
        if (object.name === name) {
            exactMatch = object;
        } else if (
            !prefixMatch &&
            object.name.startsWith(name + ".")
        ) {
            prefixMatch = object;
        }
    });

    // Prefer the exact component, not a similarly named parent.
    return exactMatch || prefixMatch;
}



/* =========================================================
   PART LOOKUP

   Finds the 3D node(s) for every part key sent by FastAPI.
   1. exact names from PART_MAP
   2. if none exist, name patterns from PART_PATTERNS
   Any node that covers almost the whole model (a parent
   group / the scene root) is rejected - colouring it would
   paint the entire conveyor, which is the bug we are fixing.
========================================================= */

const PART_PATTERNS = {
    belt:             /belt/i,
    drive_pulley:     /roller_0|roller_head|motor|shaft_head|drive|cyl_roller$/i,
    tail_pulley:      /roller_1|roller_tail|shaft_tail|tail_pulley|cyl_roller\.001/i,
    thermal_sensor:   /temperature|thermal/i,
    vibration_sensor: /vibration|mpu|gyro|accel/i,
    flame_sensor:     /flame/i,
    load_cell:        /load/i
};

const MAX_PART_SHARE = 0.85;   // a part may not own more than 85% of all meshes

function countMeshes(object) {
    let n = 0;
    object.traverse(c => { if (c.isMesh) n++; });
    return n;
}

function isInside(parent, child) {
    for (let p = child.parent; p; p = p.parent) {
        if (p === parent) return true;
    }
    return false;
}

function resolveParts() {

    const allNodes = [];
    conveyor.traverse(o => allNodes.push(o));

    const totalMeshes = Math.max(countMeshes(conveyor), 1);

    console.log(
        "[twin] nodes in GLB:",
        allNodes.map(o => o.name).filter(Boolean).join(", ")
    );

    Object.entries(PART_MAP).forEach(([key, names]) => {

        let found = names.map(findObject).filter(Boolean);

        if (found.length === 0) {
            found = allNodes.filter(
                o => o.name && PART_PATTERNS[key].test(o.name)
            );
        }

        // keep only top-most matches (children are painted with their parent)
        found = found.filter(
            o => !found.some(p => p !== o && isInside(p, o))
        );

        // reject empty nodes and nodes that are (almost) the whole model
        found = found.filter(o => {

            const meshes = countMeshes(o);

            if (meshes === 0)
                return false;

            if (meshes / totalMeshes > MAX_PART_SHARE) {
                console.warn(
                    `[twin] "${o.name}" ignored for ${key}: ` +
                    `it contains ${meshes}/${totalMeshes} meshes`
                );
                return false;
            }

            return true;
        });

        partObjects[key] = found;

        if (found.length === 0) {
            console.warn("[twin] no 3D node found for part:", key);
        } else {
            console.log(
                `[twin] ${key} ->`,
                found.map(o => `${o.name} (${countMeshes(o)} meshes)`)
            );
        }
    });
}


/* =========================================================
   PART HIGHLIGHT

   Normal   -> original model colours
   Warning  -> yellow
   Critical -> red

   Every mesh gets its OWN copy of its material the first
   time it is painted, so meshes that share one material in
   the GLB never change colour together by accident.
========================================================= */

function setPartState(object, state) {

    const faulty = state === "Warning" || state === "Critical";

    object.traverse(child => {

        if (!child.isMesh) return;

        if (!child.userData.dtOrig) {

            if (!faulty) return;          // nothing painted yet, nothing to undo

            const originals = Array.isArray(child.material)
                ? child.material
                : [child.material];

            child.userData.dtOrig = originals.map(m => ({
                color: m.color ? m.color.clone() : null,
                emissive: m.emissive ? m.emissive.clone() : null,
                emissiveIntensity: m.emissiveIntensity
            }));

            const copies = originals.map(m => m.clone());

            child.material = Array.isArray(child.material)
                ? copies
                : copies[0];
        }

        const materials = Array.isArray(child.material)
            ? child.material
            : [child.material];

        materials.forEach((material, i) => {

            const orig = child.userData.dtOrig[i];

            if (faulty) {

                const hex = state === "Warning" ? 0xffff00 : 0xff0000;

                if (material.color)
                    material.color.set(hex);

                if (material.emissive) {
                    material.emissive.set(hex);
                    material.emissiveIntensity =
                        state === "Warning" ? 0.35 : 0.5;
                }

            } else {

                if (material.color && orig.color)
                    material.color.copy(orig.color);

                if (material.emissive && orig.emissive) {
                    material.emissive.copy(orig.emissive);
                    material.emissiveIntensity = orig.emissiveIntensity;
                }
            }
        });
    });
}


/* =========================================================
   APPLY fault_parts FROM THE BACKEND

   fault_parts = [{part, level, reason}, ...]

   Only the parts listed there change colour; every other
   part goes back to its original colour. A part can go UP in
   severity immediately, but only goes DOWN after it has
   looked healthier for HOLD_MS - this stops flicker when a
   reading hovers around a threshold.
========================================================= */

const HOLD_MS = 4000;      // a part must look healthy this long before its colour clears

const shownState = {};     // part key -> { level, lowerSince }

let latestFaults = [];     // newest fault_parts, kept so it can be applied after the GLB loads

let lastFaultLog = "";

function applyFaultParts(faults) {

    latestFaults = Array.isArray(faults) ? faults : [];

    const sig = JSON.stringify(latestFaults.map(f => f.part + ":" + f.level));

    if (sig !== lastFaultLog) {
        lastFaultLog = sig;
        console.log("[twin] fault_parts ->", sig);
    }

    const wanted = {};

    (Array.isArray(faults) ? faults : []).forEach(f => {

        if (!f || !(f.level in LEVEL_RANK)) return;

        if (
            wanted[f.part] === undefined ||
            LEVEL_RANK[f.level] > LEVEL_RANK[wanted[f.part]]
        ) {
            wanted[f.part] = f.level;
        }
    });

    const now = performance.now();

    Object.keys(partObjects).forEach(key => {

        const want = wanted[key] || "Normal";

        const rec = shownState[key] ||
            (shownState[key] = { level: "Normal", lowerSince: null });

        let next = rec.level;

        if (LEVEL_RANK[want] >= LEVEL_RANK[rec.level]) {

            next = want;
            rec.lowerSince = null;

        } else {

            if (rec.lowerSince === null)
                rec.lowerSince = now;

            if (now - rec.lowerSince >= HOLD_MS) {
                next = want;
                rec.lowerSince = null;
            }
        }

        if (next !== rec.level) {
            rec.level = next;
            partObjects[key].forEach(o => setPartState(o, next));
        } else if (rec.level !== "Normal") {
            // idempotent: keeps the colour applied even if something reset it
            partObjects[key].forEach(o => setPartState(o, rec.level));
        }
    });
}


/* =========================================================
   CAMERA FIT

   Much closer than your current view.
========================================================= */


function fitCameraToModel() {

    const box =
        new THREE.Box3();


    box.setFromObject(
        conveyor
    );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    /*
       Put model centre at world origin.
    */

    conveyor.position.sub(
        center
    );


    /*
       Recalculate after centering.
    */

    box.setFromObject(
        conveyor
    );


    const sphere =
        new THREE.Sphere();


    box.getBoundingSphere(
        sphere
    );


    const radius =
        sphere.radius;


    /*
       Clean elevated 3/4 view.
    */

    camera.position.set(

        radius * 0.55,

        radius * 1.55,

        radius * 1.35

    );


    camera.lookAt(
        0,
        0,
        0
    );


    controls.target.set(
        0,
        0,
        0
    );


    controls.minDistance =
        radius * 0.6;


    controls.maxDistance =
        radius * 6;


    controls.update();


    console.log(
        "Camera fitted.",
        radius
    );
}


/* =========================================================
   LOAD GLB
========================================================= */

const loader =
    new GLTFLoader();


loader.load(

    MODEL_URL,


    gltf => {


        conveyor =
            gltf.scene;


        scene.add(
            conveyor
        );


        /* -----------------------------------------
           Hide Blender's floating status text.

           Dashboard already shows status itself.
        ----------------------------------------- */

        const blenderStatus =
            conveyor.getObjectByName(
                "DigitalTwin_Status"
            );


        if (
            blenderStatus
        ) {

            blenderStatus.visible =
                false;
        }


        /* -----------------------------------------
           Find important parts (see PART_MAP)
        ----------------------------------------- */

        resolveParts();


        /* -----------------------------------------
           Built-in GLB animation (ConveyorRun)
        ----------------------------------------- */

        if (
            gltf.animations &&
            gltf.animations.length > 0
        ) {

            mixer =
                new THREE.AnimationMixer(
                    conveyor
                );


            gltf.animations.forEach(
                clip => {

                    const action =
                        mixer.clipAction(
                            clip
                        );


                    action.play();
                }
            );


            hasGLTFAnimation =
                true;


            console.log(
                "GLB animation found:",
                gltf.animations.length
            );
        }

        else {

            console.warn(
                "No GLB animation found. Using pulley fallback."
            );
        }


        /* -----------------------------------------
           Camera AFTER status text hidden
        ----------------------------------------- */

        fitCameraToModel();


        applyFaultParts(latestFaults);


        document.getElementById(
            "status"
        ).textContent =
            "DIGITAL TWIN ONLINE";


        console.log(
            "Digital twin loaded."
        );
    },


    progress => {

        console.log(
            "Loading conveyor..."
        );
    },


    error => {

        console.error(
            "MODEL LOAD ERROR:",
            error
        );


        document.getElementById(
            "status"
        ).textContent =
            "MODEL LOAD ERROR";
    }
);


/* =========================================================
   APPLY ONE STATE PACKET

   Called for every WebSocket message (and by the
   HTTP fallback). Same JSON shape as GET /health.
========================================================= */

const statusEl =
    document.getElementById("status");

function applyState(data) {

    /* camera_update (and any other typed message) is not a sensor state */

    if (data && data.type)
        return;

    /* FastAPI sends an empty state before the first reading */

    if (!data || !data.timestamp) {

        statusEl.textContent =
            "WAITING FOR SENSOR DATA";

        statusEl.style.color = "#4b7bff";

        return;
    }


    /* 3D parts */

    applyFaultParts(data.fault_parts);


    /* motor speed -> belt / roller animation (PWM 0-255) */

    conveyorSpeed =
        Number(data.speed ?? 0);

    conveyorRunning =
        conveyorSpeed > 0;


    /* status label */

    const severity =
        data.severity || "Normal";

    const faultNames =
        (data.fault_parts || [])
            .map(f => f.part.replaceAll("_", " "))
            .join(", ");

    statusEl.textContent =

        `STATUS: ${severity.toUpperCase()} · PWM: ${Math.round(conveyorSpeed)}/255` +
        (faultNames ? ` · FAULT: ${faultNames}` : "");

    statusEl.style.color =

        severity === "Critical"
            ? "#ff3636"
            : severity === "Warning"
                ? "#ff8c1a"
                : "#4b7bff";
}


/* =========================================================
   LIVE FEED  (WebSocket  ws://.../ws)
========================================================= */

let socket = null;

let wsOpen = false;


function connectSocket() {

    socket = new WebSocket(WS_URL);

    socket.onopen = () => {

        wsOpen = true;

        console.log("Twin WebSocket connected");
    };

    socket.onmessage = event => {

        try {

            applyState(
                JSON.parse(event.data)
            );
        }

        catch (error) {

            console.error(
                "Bad WebSocket packet:",
                error
            );
        }
    };

    socket.onclose = () => {

        wsOpen = false;

        setTimeout(connectSocket, 1000);
    };

    socket.onerror = () => {

        socket.close();
    };
}


connectSocket();


/* =========================================================
   FALLBACK: poll GET /health only while WebSocket is down
========================================================= */

async function pollHealth() {

    if (wsOpen)
        return;

    try {

        const response =
            await fetch(
                API_URL,
                { cache: "no-store" }
            );

        if (!response.ok)
            throw new Error("HTTP " + response.status);

        applyState(
            await response.json()
        );
    }

    catch (error) {

        conveyorRunning = false;

        statusEl.textContent =
            "BACKEND OFFLINE";

        statusEl.style.color =
            "#ff3636";
    }
}


setInterval(pollHealth, 3000);


/* =========================================================
   RENDER / MOTION LOOP
========================================================= */

let previousTime =
    performance.now();


function animate(
    currentTime
) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(

            (
                currentTime -
                previousTime
            )
            /
            1000,

            0.1
        );


    previousTime =
        currentTime;


    const speedFactor =

        Math.max(
            conveyorSpeed,
            0
        )
        /
        255;


    if (
        conveyorRunning
    ) {


        /* =========================================
           USE EXPORTED BLENDER ANIMATION
        ========================================= */

        if (
            mixer &&
            hasGLTFAnimation
        ) {

            mixer.update(

                delta *
                Math.max(
                    speedFactor,
                    0.15
                )

            );
        }

    }


    controls.update();


    renderer.render(
        scene,
        camera
    );
}


requestAnimationFrame(
    animate
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(

    "resize",

    () => {


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,
            window.innerHeight

        );

    }

);

</script>

</body>
</html>
